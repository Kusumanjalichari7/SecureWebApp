<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - SecureWebApp</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 350px;
            margin: 80px auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #1f2937;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .back {
            text-align: center;
            margin-top: 20px;
        }

        a {
            color: #2563eb;
            text-decoration: none;
        }

        .security-note {
            margin-top: 20px;
            padding: 12px;
            background: #f8fafc;
            border-radius: 6px;
            font-size: 13px;
            color: #555;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🔐 Create Account</h1>

        <p class="subtitle">
            Register securely with SecureWebApp
        </p>

        <form method="POST" action="/register">

            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <label for="username">Username</label>

            <input
                type="text"
                id="username"
                name="username"
                minlength="3"
                maxlength="30"
                required
            >

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                name="password"
                minlength="8"
                maxlength="128"
                required
            >

            <button type="submit">Create Account</button>

        </form>

        <div class="security-note">
            🛡️ Passwords are securely hashed before being stored.
        </div>

        <div class="back">
            <a href="/">← Back to Home</a>
        </div>

    </div>

</body>
</html>
