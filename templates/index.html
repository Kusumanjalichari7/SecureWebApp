<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureWebApp</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        .container {
            max-width: 700px;
            margin: 100px auto;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            color: #1f2937;
        }

        .subtitle {
            color: #555;
            margin-bottom: 30px;
        }

        .security {
            text-align: left;
            margin: 25px 0;
            padding: 20px;
            background: #f8fafc;
            border-radius: 8px;
        }

        .security p {
            margin: 12px 0;
        }

        .button {
            display: inline-block;
            padding: 12px 24px;
            margin: 8px;
            text-decoration: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
        }

        .button:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🔐 SecureWebApp</h1>

        <p class="subtitle">
            A Cybersecurity Learning Project
        </p>

        <div class="security">

            <h2>Security Features</h2>

            <p>✅ SQL Injection Prevention</p>
            <p>✅ Password Hashing</p>
            <p>✅ CSRF Protection</p>
            <p>✅ Login Rate Limiting</p>
            <p>✅ Session Authentication</p>
            <p>✅ Security Event Logging</p>
            <p>✅ Input Validation</p>

        </div>

        <a class="button" href="/register">Create Account</a>

        <a class="button" href="/login">Login</a>

    </div>

</body>
</html>
